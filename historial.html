<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaludYa! — Historial Médico</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/historial.css">
</head>
<body class="historial-body">

  <div class="historial-container">

    <!-- Header -->
    <div class="page-header accent">
      <div class="page-header__left">
        <div class="page-header__icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <div class="page-header__info">
          <h1 class="page-header__title">Historial Médico</h1>
          <p class="page-header__subtitle">Consulta tus diagnósticos y prescripciones</p>
        </div>
      </div>
      <a href="dashboard.html" class="btn btn-ghost btn-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Regresar
      </a>
    </div>

    <!-- Tabs -->
    <div class="tabs" style="margin-bottom:var(--space-6);">
      <button class="tab-btn active" data-tab="servicesTab">Servicios Completados</button>
      <button class="tab-btn" data-tab="prescriptionsTab">Ver Prescripciones</button>
    </div>

    <!-- Services Tab -->
    <div class="tab-content active" id="servicesTab">
      <div id="servicesList"></div>
    </div>

    <!-- Prescriptions Tab -->
    <div class="tab-content" id="prescriptionsTab">
      <div id="prescriptionsList"></div>
    </div>

  </div>

  <!-- Rating Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button id="closeModal" style="position:absolute;top:var(--space-4);right:var(--space-4);background:none;border:none;cursor:pointer;color:var(--color-text-muted);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div style="position:relative;">
        <div class="modal__title">Calificar Servicio</div>
        <div class="modal__subtitle">Tu opinión nos ayuda a mejorar</div>

        <div class="star-picker">
          <span class="star-picker__star" data-star="1">★</span>
          <span class="star-picker__star" data-star="2">★</span>
          <span class="star-picker__star" data-star="3">★</span>
          <span class="star-picker__star" data-star="4">★</span>
          <span class="star-picker__star" data-star="5">★</span>
        </div>

        <div class="form-group" style="margin-bottom:var(--space-6);">
          <label class="form-label">Tu reseña (opcional)</label>
          <textarea id="ratingReview" class="form-control" placeholder="Cuéntanos tu experiencia..."></textarea>
        </div>

        <div class="modal__actions">
          <button class="btn btn-outline btn-sm" id="cancelRating">Cancelar</button>
          <button class="btn btn-accent btn-sm" id="submitRating">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Enviar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/historial.js"></script>
</body>
</html>
