<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaludYa! — Iniciar Sesión</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="login-title">Bienvenido a SaludYa!</h1>
    <p class="login-subtitle">Inicia sesión en tu cuenta</p>

    <!-- Error -->
    <div class="login-error" id="loginError">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span></span>
    </div>

    <form id="loginForm" class="login-form" novalidate>
      <!-- Username -->
      <div class="form-group">
        <label class="form-label" for="username">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Usuario
        </label>
        <input
          type="text"
          id="username"
          class="form-control"
          placeholder="Ingrese su usuario"
          autocomplete="username"
        >
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Contraseña
        </label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
          >
          <span class="input-icon" id="togglePassword">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Demo hint -->
      <div style="background:rgba(0,212,161,0.07);border:1px solid rgba(0,212,161,0.20);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--font-xs);color:var(--color-accent-dark);">
        <strong>Demo:</strong> usuario <code>juan.perez</code> · contraseña <code>saludya123</code>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-gradient btn-lg btn-block" id="submitBtn">
        <span id="btnText">Iniciar Sesión</span>
        <div class="spinner" id="btnSpinner" style="display:none;"></div>
      </button>
    </form>

    <p class="login-register" id="registerLink">¿No tienes cuenta? Regístrate aquí</p>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
