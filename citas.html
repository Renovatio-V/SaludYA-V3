<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaludYa! — Gestión de Citas</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/citas.css">
</head>
<body class="citas-body">

  <div class="citas-container">

    <!-- Header -->
    <div class="page-header">
      <div class="page-header__left">
        <div class="page-header__icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div class="page-header__info">
          <h1 class="page-header__title">Gestión de Citas</h1>
          <p class="page-header__subtitle">Organiza y gestiona tus citas médicas</p>
        </div>
      </div>
      <div style="display:flex;gap:var(--space-3);">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Regresar
        </a>
        <button class="btn btn-accent btn-sm" id="newAptBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Nueva Cita
        </button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar" style="margin-bottom:var(--space-6);">
      <span class="filter-bar__label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
        Filtrar:
      </span>
      <button class="filter-pill active" data-filter="all">
        Todos (<span id="countAll">0</span>)
      </button>
      <button class="filter-pill" data-filter="pending">
        Pendientes (<span id="countPending">0</span>)
      </button>
      <button class="filter-pill" data-filter="confirmed">
        Confirmadas (<span id="countConfirmed">0</span>)
      </button>
      <button class="filter-pill" data-filter="completed">
        Completadas (<span id="countCompleted">0</span>)
      </button>
    </div>

    <!-- Layout -->
    <div class="citas-layout form-hidden" id="citasLayout">

      <!-- New Appointment Form -->
      <div class="cita-form-card">
        <div class="cita-form-card__header">
          <div class="cita-form-card__title">Nueva Cita</div>
        </div>
        <form id="citaForm" novalidate>
          <div class="cita-form-card__body">

            <div class="form-group">
              <label class="form-label" for="patientName">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                Nombre del Paciente
              </label>
              <input type="text" id="patientName" class="form-control" placeholder="Nombre completo">
            </div>

            <div class="time-row">
              <div class="form-group">
                <label class="form-label" for="aptDate">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  Fecha
                </label>
                <input type="date" id="aptDate" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                  </svg>
                  Hr
                </label>
                <input type="number" id="aptHour" class="form-control" placeholder="10" min="6" max="19">
              </div>
              <div class="form-group">
                <label class="form-label">Min</label>
                <input type="number" id="aptMin" class="form-control" placeholder="00" min="0" max="59" step="15">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="specialty">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M12 8v4m0 4h.01"/>
                </svg>
                Especialidad Médica
              </label>
              <select id="specialty" class="form-control">
                <option value="">Selecciona una especialidad</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="reason">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                Motivo de la Cita
              </label>
              <textarea id="reason" class="form-control" placeholder="Describa el motivo de la consulta"></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-accent" style="flex:1;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Crear Cita
              </button>
              <button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancelar</button>
            </div>

          </div>
        </form>
      </div>

      <!-- Appointments List -->
      <div id="citasList" class="citas-list"></div>

    </div>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/citas.js"></script>
</body>
</html>
